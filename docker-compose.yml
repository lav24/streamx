services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: streamx
      POSTGRES_USER: streamx
      POSTGRES_PASSWORD: streamx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamx"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [streamx-net]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [streamx-net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: streamx
      MINIO_ROOT_PASSWORD: streamx123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [streamx-net]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 streamx streamx123 &&
      mc mb -p local/streamx-video &&
      mc anonymous set download local/streamx-video/renditions &&
      mc anonymous set download local/streamx-video/thumbnails
      "
    networks: [streamx-net]

  video-service:
    build: ./video-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [streamx-net]

  transcode-worker:
    build: ./transcode-worker
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [streamx-net]

  ad-campaign-service:
    build: ./ad-campaign-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [streamx-net]

  ad-decisioning-service:
    build: ./ad-decisioning-service
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [streamx-net]

  ad-tracking-service:
    build: ./ad-tracking-service
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [streamx-net]

  redis:
    image: redis:7.4.11
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [streamx-net]

  budget-pacing-service:
    build: ./budget-pacing-service
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [streamx-net]

  analytics-service:
    build: ./analytics-service
    ports:
      - "8089:8089"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [streamx-net]

networks:
  streamx-net:

volumes:
  pgdata:
  minio-data:
